unit = "crtc"
prefix = "R300_CRTC"
title = "second CRTC, cursor, palette and DAC registers of the R3xx-class FireGL boards"
doc = "Registers of the second display head and its cursor, the palette port, DAC and panel-link registers beyond those the display unit holds. Names and offsets come from the public Linux radeon header, so the grade is inferred; bit layouts are not carried. Whether IRIX programs each one is read in the display notes where it does."
from = "Linux drivers/gpu/drm/radeon/radeon_reg.h"
public_from = ["Linux drivers/gpu/drm/radeon"]
name_source = "public"
name_cite = "Linux drivers/gpu/drm/radeon/radeon_reg.h"

