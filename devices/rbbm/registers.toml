unit = "rbbm"
prefix = "R300_RBBM"
title = "register backbone manager registers of the R3xx-class FireGL boards"
doc = "Host-visible backbone registers beyond the status, reset and wait registers the display unit already holds. Names and offsets come from the public Linux radeon header, so the grade is inferred; no shipped IRIX binary read here uses them."
from = "Linux drivers/gpu/drm/radeon/radeon_reg.h"
public_from = ["Linux drivers/gpu/drm/radeon"]
name_source = "public"
name_cite = "Linux drivers/gpu/drm/radeon/radeon_reg.h"

