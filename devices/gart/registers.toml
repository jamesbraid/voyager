unit = "gart"
prefix = "R300_GART"
title = "AGP and PCI GART registers of the R3xx-class FireGL boards"
doc = "The chip-side translation of bus addresses: the AGP control word and the PCI GART table registers of the public Linux driver. The shipped IRIX driver parks the aperture and never touches the table registers, so these describe the chip for a guest that uses them, not what IRIX does."
from = "Linux drivers/gpu/drm/radeon/radeon_reg.h"
public_from = ["Linux drivers/gpu/drm/radeon"]
name_source = "public"
name_cite = "Linux drivers/gpu/drm/radeon/radeon_reg.h"

